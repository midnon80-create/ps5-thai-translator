pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Tesseract text reader (fallback for TVs where ML Kit's reader crashes); only this group comes from JitPack
        maven {
            url 'https://jitpack.io'
            content { includeGroup 'cz.adaptech.tesseract4android' }
        }
    }
}

rootProject.name = 'Chiaki'
include ':app'
